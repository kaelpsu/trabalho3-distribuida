name: Deploy MS1 Orquestrator

on:
  push:
    branches:
      - main
    paths:
      - 'ms1-orquestrator/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven (~/.m2/repository)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-ms1-orquestrator-${{ hashFiles('ms1-orquestrator/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-ms1-orquestrator-
            ${{ runner.os }}-maven-

      - name: Compilar e empacotar ms1-orquestrator
        run: mvn -B -ntp -f ms1-orquestrator/pom.xml clean package -DskipTests

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
            IdentityFile ~/.ssh/id_rsa
          EOF
          chmod 600 ~/.ssh/config

      - name: Implantar JAR via Bastion em 10.30.1.15
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          BASTION="ec2-user@${{ secrets.BASTION_HOST }}"
          DEST="ec2-user@10.30.1.15"

          scp $SSH_OPTS -o "ProxyJump=$BASTION" ms1-orquestrator/target/ms1_orquestrator-0.0.1-SNAPSHOT.jar \
            "$DEST:/home/ec2-user/app/smartshop/app.jar.tmp"
          ssh $SSH_OPTS -J "$BASTION" "$DEST" \
            "mv /home/ec2-user/app/smartshop/app.jar.tmp /home/ec2-user/app/smartshop/app.jar && sudo /var/lib/cloud/scripts/per-boot/start-smartshop.sh"
