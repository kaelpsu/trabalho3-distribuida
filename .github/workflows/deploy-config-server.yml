name: Deploy Config Server

on:
  push:
    branches:
      - main
    paths:
      - 'config-server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven (~/.m2/repository)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-config-server-${{ hashFiles('config-server/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-config-server-
            ${{ runner.os }}-maven-

      - name: Compilar e empacotar config-server
        run: mvn -B -ntp -f config-server/pom.xml clean package -DskipTests

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Implantar config-server via Bastion em 10.30.1.13
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          BASTION="ec2-user@${{ secrets.BASTION_HOST }}"
          DEST="ec2-user@10.30.1.13"

          scp $SSH_OPTS -o "ProxyJump=$BASTION" config-server/target/config_server-0.0.1-SNAPSHOT.jar \
            "$DEST:/home/ec2-user/app/smartshop/app.jar.tmp"
          ssh $SSH_OPTS -J "$BASTION" "$DEST" \
            "mv /home/ec2-user/app/smartshop/app.jar.tmp /home/ec2-user/app/smartshop/app.jar && sudo /var/lib/cloud/scripts/per-boot/start-smartshop.sh"
