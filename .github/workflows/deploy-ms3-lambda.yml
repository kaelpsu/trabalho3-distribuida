name: Deploy MS3 Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'ms3-lambda/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven (~/.m2/repository)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-ms3-lambda-${{ hashFiles('ms3-lambda/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-ms3-lambda-
            ${{ runner.os }}-maven-

      - name: Compilar shaded JAR para AWS Lambda
        run: mvn -B -ntp -f ms3-lambda/pom.xml clean package -DskipTests

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Enviar JAR para o Bucket S3 e atualizar AWS Lambda
        run: |
          FUNCTION_NAME="smartshop-trabalho3-ms3-lambda"
          S3_BUCKET="${{ secrets.AWS_DEPLOY_BUCKET }}"
          S3_KEY="ms3-lambda/ms3_lambda-aws.jar"

          aws s3 cp ms3-lambda/target/ms3_lambda-0.0.1-SNAPSHOT-aws.jar "s3://$S3_BUCKET/$S3_KEY"

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$S3_KEY"

          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION_NAME"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime java21 \
            --handler org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest \
            --memory-size 512 \
            --timeout 30

          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION_NAME"
