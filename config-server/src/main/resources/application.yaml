server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file://${user.home}/Repositórios/Distribuída/trabalho3-distribuida} # se variavel com URI não for setada, usa repositorio local
          search-paths: config-repo
          default-label: main
          clone-on-start: true
