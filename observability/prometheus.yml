global:
  scrape_interval: 5s # para ficar rápido na apresentação

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'ms1-orquestrador'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8081']

  - job_name: 'ms2-ai-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8082']

  - job_name: 'eureka-1'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8761']

  - job_name: 'eureka-2'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8762']

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8888']