spring:
  application:
    name: ms2-ai-service
  profiles:
    active: chaos-monkey
  config:
    import:
      - optional:vault://
      - configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
    vault:
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:http}
      authentication: TOKEN
      token: ${VAULT_TOKEN:root-token-trabalho3}
      kv:
        enabled: true
        backend: secret
        default-context: ms2-ai-service