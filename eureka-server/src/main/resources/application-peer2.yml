server:
  port: ${SERVER_PORT:8762}

eureka:
  instance:
    hostname: ${EUREKA_PEER2_HOST:127.0.0.1}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_PEER1_HOST:localhost}:${EUREKA_PEER1_PORT:8761}/eureka/