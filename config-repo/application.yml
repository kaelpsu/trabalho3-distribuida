# Configurações globais compartilhadas por todos os microserviços
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/,http://localhost:8762/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh,metrics,circuitbreakers,ratelimiters,bulkheads,chaosmonkey
  endpoint:
    health:
      show-details: always
    chaosmonkey:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  observations: # rotulos para zipkin
    key-values:
      application: ${spring.application.name}
  metrics: # rotulos para prometheus / grafana
    tags:
      application: ${spring.application.name}

# Feature flags globais dinâmicas (atualizáveis em tempo de execução via POST /actuator/refresh)
smartshop:
  resiliencia:
    ativa: false                        # Defina como false para desativar CircuitBreaker, RateLimiter, Retry e Bulkhead em testes de carga
  ia:
    mock-mode: false                     # Defina como true para simular respostas do Gemini sem consumir cota da API em testes de estresse (JMeter)

# configuração base do Chaos Monkey para os serviços que rodarem com perfil 'chaos-monkey'
chaos:
  monkey:
    enabled: false                       # começa DESLIGADO para garantir 0% de erro no início
    watcher:
      service: true                      # vigia todas as classes @Service
      rest-controller: true              # vigia todas as classes @RestController
      controller: true                   # vigia todas as classes @Controller
    assaults:
      level: 1                           # ataca 1 a cada 1 requisição quando ligado (100% visível)
      latency-active: false
      latency-range-start: 1000
      latency-range-end: 3000
      exceptions-active: true            # quando ligado, lança exceção nas chamadas vigiadas
      kill-application-active: false
