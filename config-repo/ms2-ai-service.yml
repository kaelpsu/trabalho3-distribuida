server:
  port: 8082

spring:
  graphql:
    graphiql:
      enabled: true
  ai:
    chat:
      observations:
        log-prompt: true # Exibe o conteudo completo do prompt e da seção MEMORY no terminal
    openai:
      api-key: ${gemini.api.key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: ${gemini.model:gemini-3.8-flash}

resilience4j:
  ratelimiter:
    instances:
      ms2AiServerRateLimiter:              # Rate Limiter no LADO SERVIDOR (MS2)
        limitForPeriod: 20                 # Aceita até 20 requisições...
        limitRefreshPeriod: 10s            # ...a cada janela de 10 segundos
        timeoutDuration: 0s
