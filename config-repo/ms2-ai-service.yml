server:
  port: 8082

spring:
  graphql:
    graphiql:
      enabled: true
  ai:
    chat:
      observations:
        log-prompt: true # exibe o conteudo completo do prompt e da seção MEMORY no terminal
    google:
      genai:
        api-key: ${gemini.api-key}
        chat:
          model: ${gemini.model:gemini-3.5-flash-lite}
        embedding:
          api-key: ${gemini.api-key}
          text:
            model: gemini-embedding-001

resilience4j:
  ratelimiter:
    instances:
      ms2AiServerRateLimiter:
        limitForPeriod: 20                 # aceita até 20 requisições
        limitRefreshPeriod: 15s            # a cada janela de 10 segundos
        timeoutDuration: 0s
