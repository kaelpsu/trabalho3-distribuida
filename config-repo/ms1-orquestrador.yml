server:
  port: 8081

smartshop:
  mensagem-boas-vindas: "Bem-vindo ao Atendimento Inteligente SmartShop v2.0" # propriedade customizada para demonstrar atualização dinâmica (@RefreshScope) sem reiniciar
  lambda-url: ${LAMBDA_URL:http://localhost:8083/validarPedido}

resilience4j:
  circuitbreaker:
    instances:
      ms2AiCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10              # avalia as últimas 10 requisições
        minimumNumberOfCalls: 5            # precisa de pelo menos 5 chamadas para calcular a taxa de falha
        failureRateThreshold: 50           # abre o disjuntor se 50% ou mais falharem
        waitDurationInOpenState: 15s       # fica aberto por 15 segundos antes de testar a recuperação (HALF_OPEN)
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

      ms3LambdaCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      ms2AiRetry:
        maxAttempts: 3                     # tenta até 3 vezes antes de acionar o Fallback
        waitDuration: 500ms                # espera 500ms entre cada tentativa
        ignoreExceptions:
          # se o Circuit Breaker ja estiver aberto, nao tenta 3 vezes: vai direto para o Fallback
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

      ms3LambdaRetry:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

  ratelimiter:
    instances:
      ms2AiClientRateLimiter:
        limitForPeriod: 15                 # permite até 15 requisições
        limitRefreshPeriod: 10s            # a cada janela de 10 segundos
        timeoutDuration: 0s                # se ultrapassar o limite, rejeita imediatamente sem esperar

  bulkhead:
    instances:
      ms2AiBulkhead:
        maxConcurrentCalls: 10             # permite no máximo 10 chamadas simultâneas para o MS2
        maxWaitDuration: 100ms
