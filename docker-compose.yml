services:
  vault:
    image: hashicorp/vault:2.2.1
    container_name: vault-trabalho3
    ports:
      - "8200:8200" # mapeia a porta 8200 do container para a 8200 da maquina host
    environment:
      # define um token fixo de acesso para ambiente de desenvolvimento
      VAULT_DEV_ROOT_TOKEN_ID: "root-token-trabalho3"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      # permissão de memória exigida pelo Vault para evitar que segredos vão para o swap do disco
      - IPC_LOCK

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-trabalho3
    network_mode: "host" # Permite acessar localhost:8081 e 8082 diretamente no Linux (expõe a porta 9090)
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-trabalho3
    network_mode: "host" # Expõe o painel do Grafana na porta 3000 e conversa com o Prometheus em localhost:9090
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin